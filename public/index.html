<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>CK VIP Lottery Demo</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
}

body{
  background:#080c15;
  color:#f5f7fb;
  max-width:480px;
  margin:auto;
  min-height:100vh;
  padding-bottom:80px;
}

button,input{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}

.hidden{
  display:none!important;
}

/* HEADER */

.header{
  height:68px;
  padding:0 16px;
  background:#111827;
  border-bottom:1px solid #273244;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:20px;
  font-weight:900;
  color:#f97316;
}

.points{
  padding:9px 14px;
  border-radius:22px;
  background:#172033;
  border:1px solid #374151;
  color:#fbbf24;
  font-weight:800;
}

/* CARD */

.card{
  background:#111827;
  border:1px solid #293548;
  border-radius:20px;
  margin:16px;
  padding:18px;
}

.hero{
  background:linear-gradient(135deg,#172554,#4c1d95);
  border:0;
}

.timer{
  font:900 28px monospace;
  background:#05070b;
  padding:8px 14px;
  border-radius:12px;
  color:#67e8f9;
}

/* BUTTONS */

.betgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:15px;
}

.numgrid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-top:10px;
}

.btn{
  padding:14px 7px;
  border-radius:13px;
  color:white;
  font-weight:900;
}

.green{
  background:#059669;
}

.red{
  background:#dc2626;
}

.purple{
  background:#7e22ce;
}

.orange{
  background:#d97706;
}

.blue{
  background:#1d4ed8;
}

/* HISTORY */

.section-title{
  color:#aeb8c7;
  font-size:14px;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  text-align:center;
  font-size:12px;
}

th,td{
  padding:9px 3px;
  border-bottom:1px solid #273244;
}

/* NAV */

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:480px;
  height:72px;
  background:#111827;
  border-top:1px solid #273244;
  display:flex;
  z-index:30;
}

.nav button{
  flex:1;
  background:none;
  color:#8994a7;
  font-weight:800;
}

.nav button.active{
  color:#f97316;
}

/* PROFILE */

.profile{
  text-align:center;
}

.avatar{
  width:72px;
  height:72px;
  border-radius:50%;
  margin:auto auto 12px;
  display:grid;
  place-items:center;
  font-size:34px;
  background:linear-gradient(135deg,#f97316,#ef4444);
}

.idbox{
  background:#0b1220;
  border:1px solid #334155;
  padding:12px;
  border-radius:12px;
  margin:14px 0;
  color:#93c5fd;
}

.players{
  display:grid;
  gap:8px;
}

.player{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:11px;
  background:#0b1220;
  border-radius:11px;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:100;
  backdrop-filter:blur(7px);
}

.modalbox{
  width:100%;
  max-width:390px;
  background:#202b3d;
  border:1px solid #40506a;
  border-radius:26px;
  padding:22px;
  text-align:center;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #3b475b;
  background:#0d1524;
  color:#fff;
  text-align:center;
  margin:7px 0;
  outline:none;
}

.primary{
  width:100%;
  padding:14px;
  border-radius:13px;
  background:linear-gradient(135deg,#f59e0b,#ea580c);
  color:#fff;
  font-weight:900;
  margin-top:8px;
}

.secondary{
  background:none;
  color:#aab4c3;
  padding:12px;
}

/* WIN */

.winbox{
  background:linear-gradient(180deg,#ff7e5f,#ef4444);
  border:2px solid #ffe8d4;
  box-shadow:0 20px 60px #000;
}

.losebox{
  background:linear-gradient(180deg,#334155,#111827);
}

.trophy{
  font-size:55px;
  animation:bounce .7s infinite alternate;
}

.badges{
  display:flex;
  gap:7px;
  justify-content:center;
  margin-top:12px;
}

.badge{
  padding:6px 10px;
  border-radius:20px;
  background:#111827;
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.winamount{
  background:white;
  color:#e11d48;
  border-radius:16px;
  padding:14px;
  font-size:30px;
  font-weight:900;
  margin:14px 0;
}

@keyframes bounce{
  to{
    transform:translateY(-10px);
  }
}

/* TOAST */

.toast{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:300;
  background:#202b3d;
  padding:13px 18px;
  border-radius:12px;
  border:1px solid #475569;
  font-weight:800;
}
</style>
</head>

<body>

<div id="toast" class="toast hidden"></div>

<!-- HEADER -->

<header class="header">

  <div class="logo">
    👑 CKLOTTERY
  </div>

  <div class="points">
    P<span id="points">0</span>
  </div>

</header>


<!-- GAME -->

<main id="gamePage">

  <div class="card hero">

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
    ">

      <div>

        <small>Demo Win Go</small>

        <h3 id="period">
          DEMO-0001
        </h3>

      </div>

      <div id="timer" class="timer">
        00:60
      </div>

    </div>

  </div>


  <div class="card">

    <div class="section-title">
      Demo ကစားမှု — Points ဖြင့်သာ
    </div>


    <div class="betgrid">

      <button
        class="btn green"
        onclick="play('အစိမ်း')"
      >
        အစိမ်း
      </button>

      <button
        class="btn purple"
        onclick="play('ခရမ်း')"
      >
        ခရမ်း
      </button>

      <button
        class="btn red"
        onclick="play('အနီ')"
      >
        အနီ
      </button>

    </div>


    <div class="numgrid">

      <button class="btn purple" onclick="play('0')">
        0
      </button>

      <button class="btn green" onclick="play('1')">
        1
      </button>

      <button class="btn red" onclick="play('2')">
        2
      </button>

      <button class="btn green" onclick="play('3')">
        3
      </button>

      <button class="btn red" onclick="play('4')">
        4
      </button>

      <button class="btn purple" onclick="play('5')">
        5
      </button>

      <button class="btn green" onclick="play('6')">
        6
      </button>

      <button class="btn red" onclick="play('7')">
        7
      </button>

      <button class="btn green" onclick="play('8')">
        8
      </button>

      <button class="btn red" onclick="play('9')">
        9
      </button>

    </div>


    <div
      class="betgrid"
      style="grid-template-columns:1fr 1fr"
    >

      <button
        class="btn orange"
        onclick="play('အကြီး')"
      >
        အကြီး 5-9
      </button>

      <button
        class="btn blue"
        onclick="play('အသေး')"
      >
        အသေး 0-4
      </button>

    </div>

  </div>


  <!-- HISTORY -->

  <div class="card">

    <div class="section-title">
      📜 ထွက်ဂဏန်း မှတ်တမ်း
    </div>

    <table>

      <thead>

        <tr>
          <th>ပွဲစဉ်</th>
          <th>ဂဏန်း</th>
          <th>အရွယ်</th>
          <th>အရောင်</th>
        </tr>

      </thead>

      <tbody id="history"></tbody>

    </table>

  </div>

</main>


<!-- PROFILE -->

<main id="profilePage" class="hidden">

  <div class="card profile">

    <div class="avatar">
      👤
    </div>

    <h2 id="username">
      Player
    </h2>

    <div class="idbox">

      PLAYER ID

      <br>

      <b id="playerId">
        CK-000000
      </b>

    </div>

    <p style="color:#9ca3af">

      Demo Points:

      <b
        id="profilePoints"
        style="color:#fbbf24"
      >
        0
      </b>

    </p>

  </div>


  <div class="card">

    <div class="section-title">
      👥 လက်ရှိ Demo Players
    </div>

    <div
      id="players"
      class="players"
    ></div>

  </div>


  <div class="card">

    <button
      class="primary"
      onclick="openAccount()"
    >
      အကောင့်အချက်အလက်
    </button>

    <button
      class="primary"
      style="background:#374151"
      onclick="resetDemo()"
    >
      Demo Data Reset
    </button>

  </div>

</main>


<!-- NAV -->

<nav class="nav">

  <button
    id="navGame"
    class="active"
    onclick="tab('game')"
  >
    🎰
    <br>
    ဂိမ်း
  </button>

  <button
    id="navProfile"
    onclick="tab('profile')"
  >
    👤
    <br>
    ပရိုဖိုင်
  </button>

</nav>


<!-- ACCOUNT -->

<div
  id="accountModal"
  class="modal hidden"
>

  <div class="modalbox">

    <h2 style="color:#f97316">
      👤 Player Account
    </h2>

    <input
      id="nameInput"
      placeholder="Player Name"
    >

    <button
      class="primary"
      onclick="saveAccount()"
    >
      သိမ်းမည်
    </button>

    <button
      class="secondary"
      onclick="closeModal('accountModal')"
    >
      ပိတ်မည်
    </button>

  </div>

</div>


<!-- BET -->

<div
  id="betModal"
  class="modal hidden"
>

  <div class="modalbox">

    <h2
      id="choiceTitle"
      style="color:#fbbf24"
    >
      ရွေးချယ်မှု
    </h2>

    <p style="
      color:#9ca3af;
      margin:8px;
    ">
      Demo Points ဖြင့်သာ ကစားနိုင်သည်
    </p>

    <input
      id="betPoints"
      type="number"
      value="100"
      min="10"
      step="10"
    >

    <button
      class="primary"
      onclick="confirmPlay()"
    >
      စတင်မည်
    </button>

    <button
      class="secondary"
      onclick="closeModal('betModal')"
    >
      မလုပ်တော့ပါ
    </button>

  </div>

</div>


<!-- RESULT -->

<div
  id="resultModal"
  class="modal hidden"
>

  <div
    id="resultBox"
    class="modalbox winbox"
  >

    <div
      id="resultIcon"
      class="trophy"
    >
      🏆
    </div>

    <h2 id="resultTitle">
      ဂုဏ်ယူပါတယ်!
    </h2>


    <div class="badges">

      <span
        class="badge"
        id="resultColor"
      >
        --
      </span>

      <span
        class="badge"
        id="resultNumber"
      >
        --
      </span>

      <span
        class="badge"
        id="resultSize"
      >
        --
      </span>

    </div>


    <div
      class="winamount"
      id="resultAmount"
    >
      +0 P
    </div>


    <p id="resultPeriod">
      --
    </p>


    <button
      class="primary"
      style="background:#111827"
      onclick="closeModal('resultModal')"
    >
      ပိတ်မည်
    </button>

  </div>

</div>


<script>

const KEY = "ck_demo_player_v2";

let data =
JSON.parse(
  localStorage.getItem(KEY) || "null"
);


if(!data){

  data = {

    name:"Player",

    id:
      "CK-" +
      Math.floor(
        100000 +
        Math.random()*900000
      ),

    points:10000,

    history:[]

  };

  save();

}


let selected = "";

let seconds = 60;

let periodNo = 1;


/* SAVE */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

  updateUI();

}


/* UI */

function updateUI(){

  document.getElementById(
    "points"
  ).textContent =
    data.points.toLocaleString();


  document.getElementById(
    "profilePoints"
  ).textContent =
    data.points.toLocaleString();


  document.getElementById(
    "username"
  ).textContent =
    data.name;


  document.getElementById(
    "playerId"
  ).textContent =
    data.id;


  document.getElementById(
    "nameInput"
  ).value =
    data.name;

}


/* TOAST */

function toast(text){

  const x =
    document.getElementById("toast");

  x.textContent = text;

  x.classList.remove(
    "hidden"
  );

  setTimeout(
    ()=>{
      x.classList.add(
        "hidden"
      );
    },
    2200
  );

}


/* TAB */

function tab(type){

  document
    .getElementById("gamePage")
    .classList
    .toggle(
      "hidden",
      type !== "game"
    );


  document
    .getElementById("profilePage")
    .classList
    .toggle(
      "hidden",
      type !== "profile"
    );


  document
    .getElementById("navGame")
    .classList
    .toggle(
      "active",
      type === "game"
    );


  document
    .getElementById("navProfile")
    .classList
    .toggle(
      "active",
      type === "profile"
    );


  if(type === "profile"){

    renderPlayers();

  }

}


/* ACCOUNT */

function openAccount(){

  document
    .getElementById("accountModal")
    .classList
    .remove("hidden");

}


function saveAccount(){

  const n =
    document
      .getElementById("nameInput")
      .value
      .trim();


  if(n){

    data.name = n;

  }


  save();

  closeModal(
    "accountModal"
  );

  toast(
    "အကောင့်အမည် သိမ်းပြီးပါပြီ"
  );

}


/* MODAL */

function closeModal(id){

  document
    .getElementById(id)
    .classList
    .add("hidden");

}


/* PLAY */

function play(choice){

  if(data.points < 10){

    toast(
      "Demo Points မလုံလောက်ပါ"
    );

    return;

  }


  selected = choice;


  document
    .getElementById(
      "choiceTitle"
    )
    .textContent =
      "ရွေးချယ်မှု: " +
      choice;


  document
    .getElementById("betModal")
    .classList
    .remove("hidden");

}


/* CONFIRM */

function confirmPlay(){

  let amount =
    Number(
      document
        .getElementById("betPoints")
        .value
    );


  if(
    !amount ||
    amount < 10
  ){

    toast(
      "အနည်းဆုံး 10 Points"
    );

    return;

  }


  if(
    amount >
    data.points
  ){

    toast(
      "Demo Points မလုံလောက်ပါ"
    );

    return;

  }


  closeModal(
    "betModal"
  );


  data.points -= amount;


  /* RANDOM DEMO RESULT */

  const n =
    Math.floor(
      Math.random()*10
    );


  let color;


  if(
    n === 0 ||
    n === 5
  ){

    color = "ခရမ်း";

  }

  else if(
    [1,3,6,8].includes(n)
  ){

    color = "အစိမ်း";

  }

  else{

    color = "အနီ";

  }


  const size =
    n >= 5
      ? "အကြီး"
      : "အသေး";


  const win =
    Math.random() > .5;


  const gain =
    win
      ? amount * 2
      : 0;


  if(win){

    data.points += gain;

  }


  const result = {

    period:
      "DEMO-" +
      String(periodNo++)
        .padStart(4,"0"),

    number:n,

    color:color,

    size:size,

    win:win,

    gain:gain

  };


  data.history.unshift(
    result
  );


  data.history =
    data.history.slice(
      0,
      12
    );


  save();

  renderHistory();

  showResult(
    result,
    amount
  );

}


/* RESULT */

function showResult(
  result,
  amount
){

  const box =
    document.getElementById(
      "resultBox"
    );


  box.classList.toggle(
    "losebox",
    !result.win
  );


  box.classList.toggle(
    "winbox",
    result.win
  );


  document.getElementById(
    "resultIcon"
  ).textContent =
    result.win
      ? "🏆"
      : "😔";


  document.getElementById(
    "resultTitle"
  ).textContent =
    result.win
      ? "သင်အနိုင်ရပါတယ်!"
      : "ဒီတစ်ကြိမ် မအောင်မြင်ပါ";


  document.getElementById(
    "resultColor"
  ).textContent =
    result.color;


  document.getElementById(
    "resultNumber"
  ).textContent =
    result.number;


  document.getElementById(
    "resultSize"
  ).textContent =
    result.size;


  document.getElementById(
    "resultAmount"
  ).textContent =
    result.win
      ? "+" +
        result.gain.toLocaleString() +
        " P"

      : "-" +
        amount.toLocaleString() +
        " P";


  document.getElementById(
    "resultPeriod"
  ).textContent =
    "Demo ပွဲစဉ်: " +
    result.period;


  document
    .getElementById(
      "resultModal"
    )
    .classList
    .remove("hidden");

}


/* HISTORY */

function renderHistory(){

  const h =
    document.getElementById(
      "history"
    );


  h.innerHTML = "";


  data.history.forEach(
    r => {

      h.innerHTML += `

        <tr>

          <td>
            ${r.period}
          </td>

          <td>
            <b>
              ${r.number}
            </b>
          </td>

          <td>
            ${r.size}
          </td>

          <td>
            ${r.color}
          </td>

        </tr>

      `;

    }
  );

}


/* PLAYERS */

function renderPlayers(){

  const list =
    document.getElementById(
      "players"
    );


  const names = [

    "LuckyPlayer",
    "CK-Star",
    "GoldenUser",
    "Player-88",
    "VIP-Demo",
    "NightPlayer"

  ];


  const players =
    names.map(
      (name,i)=>({

        name:name,

        id:
          "CK-" +
          (100001+i),

        points:
          Math.floor(
            1200 +
            Math.random()*18000
          )

      })
    );


  players.push({

    name:data.name,

    id:data.id,

    points:data.points

  });


  list.innerHTML =
    players.map(
      p => `

      <div class="player">

        <span>

          👤 ${p.name}

          <br>

          <small
            style="color:#64748b"
          >
            ${p.id}
          </small>

        </span>

        <b
          style="color:#fbbf24"
        >
          ${p.points.toLocaleString()} P
        </b>

      </div>

      `
    ).join("");

}


/* RESET */

function resetDemo(){

  if(
    confirm(
      "Demo data ပြန်စမလား?"
    )
  ){

    data = {

      name:"Player",

      id:
        "CK-" +
        Math.floor(
          100000 +
          Math.random()*900000
        ),

      points:10000,

      history:[]

    };


    save();

    renderHistory();

    toast(
      "Demo data reset ပြီးပါပြီ"
    );

  }

}


/* TIMER */

setInterval(

  ()=>{

    seconds--;


    if(seconds < 0){

      seconds = 60;

      periodNo++;

    }


    document.getElementById(
      "timer"
    ).textContent =
      "00:" +
      String(seconds)
        .padStart(2,"0");


    document.getElementById(
      "period"
    ).textContent =
      "DEMO-" +
      String(periodNo)
        .padStart(4,"0");

  },

  1000

);


/* START */

updateUI();

renderHistory();

renderPlayers();

</script>

</body>
</html>
