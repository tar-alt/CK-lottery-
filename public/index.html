<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CK VIP Lottery</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: white; padding: 16px; max-width: 480px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .logo { font-size: 20px; font-weight: bold; color: #f97316; display: flex; align-items: center; gap: 6px; }
    .actions { display: flex; gap: 8px; align-items: center; }
    .btn-action { border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; }
    .btn-deposit { background-color: #10b981; }
    .btn-withdraw { background-color: #ef4444; }
    .balance-box { background-color: #1e293b; padding: 8px 14px; border-radius: 20px; font-weight: bold; color: #f59e0b; border: 1px solid #334155; }

    .timer-card { background: linear-gradient(135deg, #3b82f6, #8b5cf6); border-radius: 16px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; }
    .timer-display { background-color: #000; font-size: 28px; font-weight: bold; padding: 6px 16px; border-radius: 12px; font-family: monospace; }
    .lock-banner { display: none; position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%); background: #ef4444; color: white; font-size: 11px; padding: 2px 10px; border-radius: 10px; font-weight: bold; }

    .bet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
    .size-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }

    .btn-color, .btn-num, .btn-size { border: none; padding: 14px 8px; border-radius: 12px; font-weight: bold; color: white; font-size: 16px; cursor: pointer; text-align: center; transition: 0.2s; }
    .btn-color:disabled, .btn-num:disabled, .btn-size:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(80%); }
    
    .bg-green { background-color: #10b981; }
    .bg-purple { background-color: #a855f7; }
    .bg-red { background-color: #ef4444; }
    .bg-orange { background-color: #f59e0b; }
    .bg-blue { background-color: #3b82f6; }

    .history-card { background-color: #1e293b; border-radius: 16px; padding: 16px; margin-top: 10px; }
    .history-card h3 { margin-bottom: 12px; font-size: 16px; color: #94a3b8; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 14px; }
    th, td { padding: 10px 4px; border-bottom: 1px solid #334155; }
    th { color: #64748b; font-weight: normal; }

    .tracker { background: #334155; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }

    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .modal-content { background: #1e293b; padding: 24px; border-radius: 20px; width: 90%; max-width: 360px; text-align: center; }
    .hidden { display: none !important; }
    
    .result-card { padding: 20px; border-radius: 16px; margin-bottom: 16px; }
    .result-win { background: rgba(16, 185, 129, 0.2); border: 2px solid #10b981; color: #10b981; }
    .result-lose { background: rgba(239, 68, 68, 0.2); border: 2px solid #ef4444; color: #ef4444; }
    
    input[type="number"] { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 16px; margin: 16px 0; text-align: center; }
    .btn-confirm { width: 100%; padding: 12px; background: #f59e0b; color: white; font-weight: bold; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
    .btn-close { margin-top: 10px; background: transparent; border: none; color: #94a3b8; cursor: pointer; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="logo">👑 CKLOTTERY</div>
    <div class="actions">
      <button class="btn-action btn-deposit" onclick="openTxModal('Deposit')">သွင်း</button>
      <button class="btn-action btn-withdraw" onclick="openTxModal('Withdraw')">ထုတ်</button>
      <div class="balance-box">K<span id="balance">10,000</span></div>
    </div>
  </div>

  <!-- Timer Card -->
  <div class="timer-card">
    <div>
      <div style="font-size: 13px; opacity: 0.9;">Win Go 1Min</div>
      <div id="period-text" style="font-size: 14px; font-weight: bold; margin-top: 4px;">--</div>
    </div>
    <div class="timer-display" id="timer-display">00:60</div>
    <div id="lock-banner" class="lock-banner">လောင်းကြေးပိတ်ပါပြီ</div>
  </div>

  <!-- Bet Tracker -->
  <div id="bet-tracker" class="tracker hidden">
    <span>လောင်းထားသည်: <b id="tracked-selection" style="color: #f59e0b;">-</b></span>
    <span>ပမာဏ: <b id="tracked-amount" style="color: #10b981;">0</b> ကျပ်</span>
  </div>

  <!-- Colors -->
  <div class="bet-grid">
    <button class="btn-color bg-green bet-btn" onclick="openBetModal('အစိမ်း')">အစိမ်း</button>
    <button class="btn-color bg-purple bet-btn" onclick="openBetModal('ခရမ်း')">ခရမ်း</button>
    <button class="btn-color bg-red bet-btn" onclick="openBetModal('အနီ')">အနီ</button>
  </div>

  <!-- Numbers -->
  <div class="num-grid">
    <button class="btn-num bg-purple bet-btn" onclick="openBetModal('0')">0</button>
    <button class="btn-num bg-green bet-btn" onclick="openBetModal('1')">1</button>
    <button class="btn-num bg-red bet-btn" onclick="openBetModal('2')">2</button>
    <button class="btn-num bg-green bet-btn" onclick="openBetModal('3')">3</button>
    <button class="btn-num bg-red bet-btn" onclick="openBetModal('4')">4</button>
    <button class="btn-num bg-purple bet-btn" onclick="openBetModal('5')">5</button>
    <button class="btn-num bg-red bet-btn" onclick="openBetModal('6')">6</button>
    <button class="btn-num bg-green bet-btn" onclick="openBetModal('7')">7</button>
    <button class="btn-num bg-red bet-btn" onclick="openBetModal('8')">8</button>
    <button class="btn-num bg-green bet-btn" onclick="openBetModal('9')">9</button>
  </div>

  <!-- Big/Small -->
  <div class="size-grid">
    <button class="btn-size bg-orange bet-btn" onclick="openBetModal('အကြီး')">အကြီး (5-9)</button>
    <button class="btn-size bg-blue bet-btn" onclick="openBetModal('အသေး')">အသေး (0-4)</button>
  </div>

  <!-- History Table -->
  <div class="history-card">
    <h3>ထွက်ဂဏန်း မှတ်တမ်း</h3>
    <table>
      <thead>
        <tr>
          <th>ပွဲစဉ်</th>
          <th>ဂဏန်း</th>
          <th>အသေး/အကြီး</th>
          <th>အရောင်</th>
        </tr>
      </thead>
      <tbody id="history-rows"></tbody>
    </table>
  </div>

  <!-- Bet Modal -->
  <div id="bet-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="bet-title" style="color: #f59e0b;">လောင်းမည်</h3>
      <input type="number" id="bet-amount" value="1000" min="100" step="100">
      <button class="btn-confirm" onclick="submitBet()">အတည်ပြုမည်</button>
      <button class="btn-close" onclick="closeModal('bet-modal')">ပိတ်မည်</button>
    </div>
  </div>

  <!-- Result Modal -->
  <div id="result-modal" class="modal hidden">
    <div class="modal-content">
      <div id="result-card-bg" class="result-card result-win">
        <h2 id="result-status-text">YOU WIN! 🎉</h2>
        <p id="result-detail-text" style="margin-top: 8px;">-</p>
      </div>
      <button class="btn-confirm" onclick="closeModal('result-modal')">သိပြီ</button>
    </div>
  </div>

  <!-- Deposit/Withdraw Modal -->
  <div id="tx-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="tx-title">ငွေသွင်းမည်</h3>
      <p style="font-size: 13px; color: #94a3b8; margin-top: 8px;">KPay/CB/AYA သို့ ငွေလွှဲပြီး Admin ထံ ဆက်သွယ်ပါ။</p>
      <button class="btn-confirm" style="margin-top: 16px;" onclick="submitTx()">အတည်ပြုပါ</button>
      <button class="btn-close" onclick="closeModal('tx-modal')">ပိတ်မည်</button>
    </div>
  </div>

  <script>
    const socket = io();

    // 1. Balance ကို LocalStorage တွင် အတည်မှတ်ထားခြင်း (Refresh သည့်အခါ 10000 ပြန်မဖြစ်တော့ပါ)
    let savedBal = localStorage.getItem('user_balance');
    let userBalance = (savedBal !== null && !isNaN(parseFloat(savedBal))) 
      ? parseFloat(savedBal) 
      : 10000;

    function updateBalance(newBal) {
      userBalance = Math.max(0, newBal);
      localStorage.setItem('user_balance', userBalance);
      document.getElementById('balance').textContent = userBalance.toLocaleString();
    }

    updateBalance(userBalance);

    let selectedSelection = null;
    let activeBet = null;
    let currentPeriod = '';
    let isLocked = false;

    // 2. Refresh လုပ်လျှင်လည်း လောင်းထားသော အချက်အလက်များ မပျောက်စေရန် LocalStorage မှ ပြန်ခေါ်ခြင်း
    function restoreActiveBet() {
      const savedBet = localStorage.getItem('active_bet');
      if (savedBet) {
        activeBet = JSON.parse(savedBet);
        document.getElementById('tracked-selection').textContent = activeBet.selection;
        document.getElementById('tracked-amount').textContent = activeBet.amount.toLocaleString();
        document.getElementById('bet-tracker').classList.remove('hidden');
      }
    }
    restoreActiveBet();

    socket.on('timer_tick', (data) => {
      currentPeriod = data.period;
      document.getElementById('period-text').textContent = data.period;
      
      const timeLeft = data.timeLeft;
      const s = timeLeft < 10 ? '0' + timeLeft : timeLeft;
      document.getElementById('timer-display').textContent = `00:${s}`;

      // 3. နောက်ဆုံး ၁၀ စက္ကန့်တွင် လောင်းကြေး ပိတ်ခြင်း (Disable buttons & Close Modal)
      if (timeLeft <= 10) {
        if (!isLocked) {
          isLocked = true;
          toggleBetButtons(true);
          closeModal('bet-modal'); // တကယ်လို့ Modal ပွင့်နေရင် ပိတ်လိုက်မည်
          document.getElementById('lock-banner').style.display = 'block';
        }
      } else {
        if (isLocked) {
          isLocked = false;
          toggleBetButtons(false);
          document.getElementById('lock-banner').style.display = 'none';
        }
      }
    });

    function toggleBetButtons(disabled) {
      const buttons = document.querySelectorAll('.bet-btn');
      buttons.forEach(btn => btn.disabled = disabled);
    }

    socket.on('new_game_result', (data) => {
      addHistoryRow(data.period, data.number, data.bigSmall, data.color);

      // ပွဲစဉ်တူပါက နိုင်/ရှုံး တွက်ချက်ခြင်း
      if (activeBet && String(activeBet.period) === String(data.period)) {
        let isWin = false;

        if (activeBet.selection === 'အကြီး' && data.number >= 5) isWin = true;
        else if (activeBet.selection === 'အသေး' && data.number < 5) isWin = true;
        else if (activeBet.selection === String(data.number)) isWin = true;
        else if (activeBet.selection === 'အစိမ်း' && (data.color.includes('အစိမ်း'))) isWin = true;
        else if (activeBet.selection === 'အနီ' && (data.color.includes('အနီ'))) isWin = true;
        else if (activeBet.selection === 'ခရမ်း' && (data.color.includes('ခရမ်း'))) isWin = true;

        if (isWin) {
          const winAmount = activeBet.amount * 2;
          updateBalance(userBalance + winAmount);
        }

        showResultPopup(isWin, data.number);

        // လောင်းထားတာ ပိုင်နိုင်စွာ ပို့ပြီးလျှင် Clear လုပ်မည်
        activeBet = null;
        localStorage.removeItem('active_bet');
        document.getElementById('bet-tracker').classList.add('hidden');
      }
    });

    function showResultPopup(isWin, num) {
      const modal = document.getElementById('result-modal');
      const bg = document.getElementById('result-card-bg');
      const status = document.getElementById('result-status-text');
      const detail = document.getElementById('result-detail-text');

      if (isWin) {
        bg.className = "result-card result-win";
        status.textContent = "YOU WIN! 🎉";
      } else {
        bg.className = "result-card result-lose";
        status.textContent = "YOU LOSE 💔";
      }
      detail.textContent = `ထွက်ဂဏန်းမှာ [ ${num} ] ဖြစ်ပါသည်`;
      modal.classList.remove('hidden');
    }

    function openBetModal(selection) {
      if (isLocked) return alert("ပွဲစဉ်ပြီးခါနီး ၁၀ စက္ကန့်အတွင်း လောင်း၍မရပါ");
      selectedSelection = selection;
      document.getElementById('bet-title').textContent = `လောင်းမည်: [ ${selection} ]`;
      document.getElementById('bet-modal').classList.remove('hidden');
    }

    function submitBet() {
      if (isLocked) {
        closeModal('bet-modal');
        return alert("အချိန်စေ့သွားပါပြီ! လောင်း၍မရတော့ပါ");
      }

      const amtInput = document.getElementById('bet-amount');
      const amt = amtInput ? parseFloat(amtInput.value) : 0;
      
      if (isNaN(amt) || amt <= 0) return alert("မှန်ကန်သော ပမာဏ ရိုက်ထည့်ပါ");
      if (amt > userBalance) return alert("လက်ကျန်ငွေ မလုံလောက်ပါ");

      updateBalance(userBalance - amt);

      activeBet = { period: currentPeriod, selection: selectedSelection, amount: amt };
      
      // LocalStorage တွင် active_bet ကိုပါ သိမ်းဆည်းထားမည်
      localStorage.setItem('active_bet', JSON.stringify(activeBet));

      document.getElementById('tracked-selection').textContent = selectedSelection;
      document.getElementById('tracked-amount').textContent = amt.toLocaleString();
      document.getElementById('bet-tracker').classList.remove('hidden');

      fetch('/api/bet', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ period: currentPeriod, selection: selectedSelection, amount: amt })
      }).catch(e => console.log(e));

      closeModal('bet-modal');
    }

    function openTxModal(type) {
      document.getElementById('tx-title').textContent = type === 'Deposit' ? 'ငွေသွင်းမည်' : 'ငွေထုတ်မည်';
      document.getElementById('tx-modal').classList.remove('hidden');
    }

    function submitTx() {
      alert("တောင်းဆိုမှု အောင်မြင်ပါသည်။ Admin ထံ ပေးပို့လိုက်ပါပြီ။");
      closeModal('tx-modal');
    }

    function closeModal(id) { 
      const modal = document.getElementById(id);
      if (modal) modal.classList.add('hidden'); 
    }

    function addHistoryRow(period, num, bs, color) {
      const tbody = document.getElementById('history-rows');
      if(!tbody) return;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${period}</td><td><strong style="color:#f59e0b; font-size:16px;">${num}</strong></td><td>${bs}</td><td>${color}</td>`;
      tbody.insertBefore(tr, tbody.firstChild);
      if (tbody.children.length > 10) tbody.removeChild(tbody.lastChild);
    }

    fetch('/api/history').then(res => res.json()).then(data => {
      if(Array.isArray(data)){
        data.slice().reverse().forEach(item => addHistoryRow(item.period, item.number, item.bigSmall, item.color));
      }
    }).catch(e => console.log(e));
  </script>
</body>
</html>
