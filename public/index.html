<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CK VIP Lottery - WinGo 1Min</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --accent-gold: #f59e0b;
      --green-btn: #10b981;
      --purple-btn: #8b5cf6;
      --red-btn: #ef4444;
      --blue-btn: #3b82f6;
    }

    body { margin: 0; font-family: Arial, sans-serif; background-color: var(--bg-color); color: #fff; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; min-height: 100vh; background-color: #0f172a; padding: 15px; box-sizing: border-box; }

    /* Auth Overlay */
    .auth-overlay { position: fixed; inset: 0; background: rgba(11, 17, 32, 0.95); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .auth-card { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 85%; }
    .auth-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
    .auth-card button { width: 100%; padding: 12px; background: var(--accent-gold); border: none; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
    .balance-box { background: #1e293b; padding: 8px 16px; border-radius: 20px; color: var(--accent-gold); font-weight: bold; }

    .timer-card { background: linear-gradient(135deg, #4f46e5, #7c3aed); border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .timer-clock { background: #0f172a; padding: 8px 15px; border-radius: 8px; font-size: 24px; font-weight: bold; color: #38bdf8; }

    .color-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .btn { padding: 15px; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; font-size: 16px; }
    .bg-green { background-color: var(--green-btn); }
    .bg-purple { background-color: var(--purple-btn); }
    .bg-red { background-color: var(--red-btn); }
    .bg-big { background-color: #d97706; }
    .bg-small { background-color: #2563eb; }

    .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 15px; }
    .num-btn { aspect-ratio: 1; border-radius: 8px; border: none; color: white; font-size: 18px; font-weight: bold; cursor: pointer; }
    .size-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }

    /* History Table */
    .history-card { background: var(--card-bg); border-radius: 10px; padding: 12px; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
    th, td { padding: 8px; border-bottom: 1px solid #334155; }
    th { color: #94a3b8; }
    .ball { display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 50%; font-weight: bold; color: #fff; }

    /* Modal */
    .popup-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; }
    .popup-content { background: var(--card-bg); padding: 25px; border-radius: 15px; text-align: center; width: 260px; }
  </style>
</head>
<body>

<div class="auth-overlay" id="authModal">
  <div class="auth-card">
    <h2 style="text-align: center; color: var(--accent-gold);">CK VIP LOTTERY</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">ဝင်ရောက်မည်</button>
  </div>
</div>

<div class="app-container">
  <div class="header">
    <h3 style="color: var(--accent-gold); margin:0;">👑 CKLOTTERY</h3>
    <div class="balance-box" id="balanceDisplay">K0.00</div>
  </div>

  <div class="timer-card">
    <div>
      <div>Win Go 1Min</div>
      <small id="periodDisplay">P: -</small>
    </div>
    <div class="timer-clock" id="timerDisplay">00:00</div>
  </div>

  <!-- Betting Buttons -->
  <div class="color-btns">
    <button class="btn bg-green" onclick="placeBet('color', 'green', 1000)">အစိမ်း</button>
    <button class="btn bg-purple" onclick="placeBet('color', 'purple', 1000)">ခရမ်း</button>
    <button class="btn bg-red" onclick="placeBet('color', 'red', 1000)">အနီ</button>
  </div>

  <div class="number-grid">
    <button class="num-btn bg-purple" onclick="placeBet('number', 0, 1000)">0</button>
    <button class="num-btn bg-green" onclick="placeBet('number', 1, 1000)">1</button>
    <button class="num-btn bg-red" onclick="placeBet('number', 2, 1000)">2</button>
    <button class="num-btn bg-green" onclick="placeBet('number', 3, 1000)">3</button>
    <button class="num-btn bg-red" onclick="placeBet('number', 4, 1000)">4</button>
    <button class="num-btn bg-purple" onclick="placeBet('number', 5, 1000)">5</button>
    <button class="num-btn bg-red" onclick="placeBet('number', 6, 1000)">6</button>
    <button class="num-btn bg-green" onclick="placeBet('number', 7, 1000)">7</button>
    <button class="num-btn bg-red" onclick="placeBet('number', 8, 1000)">8</button>
    <button class="num-btn bg-green" onclick="placeBet('number', 9, 1000)">9</button>
  </div>

  <div class="size-btns">
    <button class="btn bg-big" onclick="placeBet('size', 'big', 1000)">အကြီး (5-9)</button>
    <button class="btn bg-small" onclick="placeBet('size', 'small', 1000)">အသေး (0-4)</button>
  </div>

  <!-- Game History Record Table -->
  <div class="history-card">
    <h4 style="margin-top:0; color:#38bdf8;">📜 ထွက်ခဲ့သည့် မှတ်တမ်းများ (History)</h4>
    <table>
      <thead>
        <tr>
          <th>Period</th>
          <th>Number</th>
          <th>Size</th>
        </tr>
      </thead>
      <tbody id="historyTable">
        <tr><td colspan="3">Waiting for rounds...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div class="popup-modal" id="resultModal">
  <div class="popup-content">
    <h2 id="popupTitle"></h2>
    <p id="popupDetails"></p>
    <button class="btn bg-big" onclick="closePopup()">OK</button>
  </div>
</div>

<script>
  const socket = io();
  let currentUser = null;
  let historyList = [];

  window.onload = () => {
    const savedUser = localStorage.getItem('lottery_user');
    if (savedUser) {
      currentUser = JSON.parse(savedUser);
      document.getElementById('authModal').style.display = 'none';
      initUserSession();
    }
  };

  async function login() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;

    const res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();

    if (res.ok) {
      currentUser = data.user;
      localStorage.setItem('lottery_user', JSON.stringify(currentUser));
      document.getElementById('authModal').style.display = 'none';
      initUserSession();
    } else { alert(data.error); }
  }

  function initUserSession() {
    document.getElementById('balanceDisplay').innerText = `K${currentUser.balance.toLocaleString()}`;
    socket.emit('join', currentUser.username);
  }

  socket.on('timer_update', (data) => {
    let secs = data.timer < 10 ? '0' + data.timer : data.timer;
    document.getElementById('timerDisplay').innerText = `00:${secs}`;
    document.getElementById('periodDisplay').innerText = `P: ${data.period}`;
  });

  socket.on('round_ended', (result) => {
    historyList.unshift(result);
    if(historyList.length > 10) historyList.pop();
    renderHistory();
  });

  function renderHistory() {
    const tbody = document.getElementById('historyTable');
    tbody.innerHTML = historyList.map(h => {
      let bg = h.color === 'green' ? '#10b981' : (h.color === 'red' ? '#ef4444' : '#8b5cf6');
      return `
        <tr>
          <td>${h.period}</td>
          <td><span class="ball" style="background:${bg}">${h.number}</span></td>
          <td>${h.size}</td>
        </tr>
      `;
    }).join('');
  }

  socket.on('balance_updated', (newBalance) => {
    currentUser.balance = newBalance;
    document.getElementById('balanceDisplay').innerText = `K${newBalance.toLocaleString()}`;
  });

  socket.on('bet_result', (data) => {
    const modal = document.getElementById('resultModal');
    const title = document.getElementById('popupTitle');
    const details = document.getElementById('popupDetails');

    if (data.won) {
      title.innerText = "🎉 နိုင်ပါသည်!";
      title.style.color = "#10b981";
      details.innerText = `ထွက်ဂဏန်း: ${data.result.number} | ရရှိငွေ: K${data.payout}`;
    } else {
      title.innerText = "😢 ရှုံးပါသည်";
      title.style.color = "#ef4444";
      details.innerText = `ထွက်ဂဏန်း: ${data.result.number}`;
    }
    modal.style.display = 'flex';
  });

  function placeBet(type, value, amount) {
    if (!currentUser) return;
    socket.emit('place_bet', { username: currentUser.username, type, value, amount });
  }

  function closePopup() {
    document.getElementById('resultModal').style.display = 'none';
  }
</script>
</body>
</html>
