<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CK VIP Lottery</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0b0f19; color: #f3f4f6; padding-bottom: 70px; max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

    #toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 400px; pointer-events: none; }
    .toast { background: rgba(30, 41, 59, 0.95); color: #fff; padding: 14px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: center; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 10px 25px rgba(0,0,0,0.5); backdrop-filter: blur(8px); margin-bottom: 10px; }

    .header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: #111827; border-bottom: 1px solid #1f2937; }
    .logo { font-size: 18px; font-weight: 800; color: #f97316; }
    .balance-box { background: linear-gradient(135deg, #1e293b, #0f172a); padding: 6px 14px; border-radius: 20px; font-weight: 700; color: #fbbf24; border: 1px solid #374151; }

    .btn-press { transition: transform 0.08s ease; cursor: pointer; border: none; outline: none; }
    .btn-press:active { transform: scale(0.92); }

    .timer-card { background: linear-gradient(135deg, #2563eb, #7c3aed); border-radius: 18px; padding: 16px; margin: 16px; display: flex; justify-content: space-between; align-items: center; }
    .timer-display { background: #000; font-size: 26px; font-weight: 900; padding: 6px 16px; border-radius: 10px; color: #38bdf8; font-family: monospace; }

    .bet-container { padding: 0 16px; }
    .bet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .num-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
    .size-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }

    .btn-color, .btn-num, .btn-size { padding: 14px 8px; border-radius: 14px; font-weight: 800; color: white; font-size: 15px; text-align: center; }
    .bg-green { background: linear-gradient(135deg, #10b981, #059669); }
    .bg-purple { background: linear-gradient(135deg, #a855f7, #7e22ce); }
    .bg-red { background: linear-gradient(135deg, #ef4444, #dc2626); }
    .bg-orange { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .bg-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }

    .history-card { background: #111827; border-radius: 16px; padding: 16px; margin: 16px; border: 1px solid #1f2937; }
    table { width: 100%; border-collapse: collapse; text-align: center; font-size: 13px; }
    th, td { padding: 10px 4px; border-bottom: 1px solid #1f2937; }

    .nav-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: #111827; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #1f2937; z-index: 50; }
    .nav-item { color: #9ca3af; text-align: center; font-size: 11px; font-weight: 600; text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .nav-item.active { color: #f97316; }

    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 200; backdrop-filter: blur(6px); }
    .modal-content { background: #1f2937; padding: 24px; border-radius: 24px; width: 90%; max-width: 380px; text-align: center; border: 1px solid #374151; }
    .hidden { display: none !important; }

    input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #374151; background: #111827; color: white; font-size: 15px; margin: 8px 0; text-align: center; outline: none; }
    .btn-confirm { width: 100%; padding: 14px; background: linear-gradient(135deg, #f59e0b, #d97706); color: white; font-weight: bold; border-radius: 14px; font-size: 16px; margin-top: 8px; }

    .profile-card { background: #111827; border-radius: 16px; padding: 20px; margin: 16px; border: 1px solid #1f2937; text-align: center; }
    .profile-avatar { width: 64px; height: 64px; background: linear-gradient(135deg, #f97316, #ef4444); border-radius: 50%; margin: 0 auto 12px; display: flex; justify-content: center; align-items: center; font-size: 28px; }
    .profile-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  </style>
</head>
<body>

  <div id="toast-container"></div>

  <div id="app-content" class="hidden">
    <div class="header">
      <div class="logo">👑 CKLOTTERY</div>
      <div class="balance-box">K<span id="balance">0</span></div>
    </div>

    <!-- Game Page -->
    <div id="page-game">
      <div class="timer-card">
        <div>
          <div style="font-size: 12px; opacity: 0.8;">Win Go 1Min</div>
          <div id="period-text" style="font-size: 15px; font-weight: 800; margin-top: 2px;">--</div>
        </div>
        <div class="timer-display" id="timer-display">00:60</div>
      </div>

      <div class="bet-container">
        <div class="bet-grid">
          <button class="btn-color bg-green btn-press" onclick="openBetModal('အစိမ်း')">အစိမ်း</button>
          <button class="btn-color bg-purple btn-press" onclick="openBetModal('ခရမ်း')">ခရမ်း</button>
          <button class="btn-color bg-red btn-press" onclick="openBetModal('အနီ')">အနီ</button>
        </div>

        <div class="num-grid">
          <button class="btn-num bg-purple btn-press" onclick="openBetModal('0')">0</button>
          <button class="btn-num bg-green btn-press" onclick="openBetModal('1')">1</button>
          <button class="btn-num bg-red btn-press" onclick="openBetModal('2')">2</button>
          <button class="btn-num bg-green btn-press" onclick="openBetModal('3')">3</button>
          <button class="btn-num bg-red btn-press" onclick="openBetModal('4')">4</button>
          <button class="btn-num bg-purple btn-press" onclick="openBetModal('5')">5</button>
          <button class="btn-num bg-red btn-press" onclick="openBetModal('6')">6</button>
          <button class="btn-num bg-green btn-press" onclick="openBetModal('7')">7</button>
          <button class="btn-num bg-red btn-press" onclick="openBetModal('8')">8</button>
          <button class="btn-num bg-green btn-press" onclick="openBetModal('9')">9</button>
        </div>

        <div class="size-grid">
          <button class="btn-size bg-orange btn-press" onclick="openBetModal('အကြီး')">အကြီး (5-9)</button>
          <button class="btn-size bg-blue btn-press" onclick="openBetModal('အသေး')">အသေး (0-4)</button>
        </div>
      </div>

      <div class="history-card">
        <h3 style="margin-bottom: 12px; font-size: 15px; color: #9ca3af;">ထွက်ဂဏန်း မှတ်တမ်း</h3>
        <table>
          <thead>
            <tr>
              <th>ပွဲစဉ်</th>
              <th>ဂဏန်း</th>
              <th>အသေး/အကြီး</th>
              <th>အရောင်</th>
            </tr>
          </thead>
          <tbody id="history-rows"></tbody>
        </table>
      </div>
    </div>

    <!-- Profile Page -->
    <div id="page-profile" class="hidden">
      <div class="profile-card">
        <div class="profile-avatar">👤</div>
        <h3 id="profile-phone" style="color: #f3f4f6;">--</h3>
        <p style="color: #9ca3af; font-size: 13px; margin-top: 4px;">လက်ကျန်ငွေ: <span id="profile-balance" style="color: #fbbf24; font-weight: bold;">0</span> K</p>
        
        <div class="profile-actions">
          <button class="btn-confirm btn-press" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="openDepositModal()">ငွေသွင်းမည်</button>
          <button class="btn-confirm btn-press" style="background: linear-gradient(135deg, #ef4444, #dc2626);" onclick="openWithdrawModal()">ငွေထုတ်မည်</button>
        </div>
      </div>

      <div style="padding: 0 16px;">
        <button class="btn-confirm btn-press" style="background: #374151;" onclick="logout()">အကောင့်မှ ထွက်မည်</button>
      </div>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
      <div class="nav-item active btn-press" id="nav-game" onclick="switchTab('game')">
        <span style="font-size: 18px;">🎰</span>
        <span>ဂိမ်း</span>
      </div>
      <div class="nav-item btn-press" id="nav-profile" onclick="switchTab('profile')">
        <span style="font-size: 18px;">👤</span>
        <span>ပရိုဖိုင်</span>
      </div>
    </div>
  </div>

  <!-- Deposit Modal -->
  <div id="deposit-modal" class="modal hidden">
    <div class="modal-content">
      <h3 style="color: #10b981; margin-bottom: 10px;">ငွေသွင်းမည်</h3>
      
      <div id="dep-step-1">
        <select id="dep-method">
          <option value="KPay">KPay</option>
          <option value="WavePay">WavePay</option>
        </select>
        <input type="number" id="dep-amount" placeholder="ငွေပမာဏ (ကျပ်)">
        <button class="btn-confirm btn-press" onclick="submitDepositRequest()">ဆက်လက်လုပ်ဆောင်မည်</button>
      </div>

      <div id="dep-step-2" class="hidden">
        <p style="font-size: 13px; color: #9ca3af;">အောက်ပါ နံပါတ်သို့ ငွေလွှဲပေးပါ:</p>
        <h2 id="admin-pay-number" style="color: #fbbf24; margin: 10px 0;">--</h2>
        <input type="text" id="dep-user-phone" placeholder="သင့် KPay/Wave ဖုန်းနံပါတ်">
        <input type="text" id="dep-txn-id" placeholder="လုပ်ငန်းစဉ်နံပါတ် (နောက် ၆ လုံး)">
        <button class="btn-confirm btn-press" onclick="confirmDepositPayment()">ငွေလွှဲပြီးပါပြီ (Confirm)</button>
      </div>

      <button style="margin-top: 12px; background: none; border: none; color: #9ca3af;" class="btn-press" onclick="closeModal('deposit-modal')">ပိတ်မည်</button>
    </div>
  </div>

  <!-- Withdraw Modal -->
  <div id="withdraw-modal" class="modal hidden">
    <div class="modal-content">
      <h3 style="color: #ef4444; margin-bottom: 10px;">ငွေထုတ်မည်</h3>
      <select id="wd-method">
        <option value="KPay">KPay</option>
        <option value="WavePay">WavePay</option>
      </select>
      <input type="text" id="wd-user-phone" placeholder="ငွေလက်ခံမည့် ဖုန်းနံပါတ်">
      <input type="number" id="wd-amount" placeholder="ထုတ်ယူလိုသည့် ပမာဏ (ကျပ်)">
      <button class="btn-confirm btn-press" onclick="submitWithdraw()">ငွေထုတ်ယူမည်</button>
      <button style="margin-top: 12px; background: none; border: none; color: #9ca3af;" class="btn-press" onclick="closeModal('withdraw-modal')">မလုပ်တော့ပါ</button>
    </div>
  </div>

  <!-- Bet Modal -->
  <div id="bet-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="bet-title" style="color: #f59e0b; margin-bottom: 10px;">လောင်းမည်</h3>
      <input type="number" id="bet-amount" value="1000" min="100">
      <button class="btn-confirm btn-press" onclick="submitBet()">အတည်ပြုမည်</button>
      <button style="margin-top: 12px; background: none; border: none; color: #9ca3af;" class="btn-press" onclick="closeModal('bet-modal')">မလုပ်တော့ပါ</button>
    </div>
  </div>

  <!-- Auth Modal -->
  <div id="auth-modal" class="modal">
    <div class="modal-content">
      <h2 id="auth-title" style="color: #f97316; margin-bottom: 8px;">Login ဝင်မည်</h2>
      <input type="text" id="auth-phone" placeholder="ဖုန်းနံပါတ်">
      <input type="password" id="auth-pass" placeholder="စကားဝှက်">
      <button class="btn-confirm btn-press" id="auth-submit-btn" onclick="handleAuth()">Login ဝင်မည်</button>
      <div style="margin-top: 14px;">
        <span style="color: #6366f1; font-size: 13px;" class="btn-press" onclick="toggleAuthMode()">အကောင့်အသစ်ဖွင့်မည်</span>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentUser = null;
    let selectedSelection = '';
    let currentTxId = null;
    let isRegisterMode = false;

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function checkAutoLogin() {
      const savedPhone = localStorage.getItem('user_phone');
      if (savedPhone) {
        fetch(`/api/user/${savedPhone}`)
          .then(res => res.json())
          .then(data => { if (data.success) loginSuccess(data.user); });
      }
    }

    function handleAuth() {
      const phone = document.getElementById('auth-phone').value;
      const password = document.getElementById('auth-pass').value;
      if (!phone || !password) return showToast("အချက်အလက် ဖြည့်သွင်းပါ");

      fetch(isRegisterMode ? '/api/register' : '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.success) loginSuccess(data.user);
        else showToast(data.message);
      });
    }

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').textContent = isRegisterMode ? "အကောင့်အသစ်ဖွင့်မည်" : "Login ဝင်မည်";
      document.getElementById('auth-submit-btn').textContent = isRegisterMode ? "Register ပြုလုပ်မည်" : "Login ဝင်မည်";
    }

    function loginSuccess(user) {
      currentUser = user;
      localStorage.setItem('user_phone', user.phone);
      updateBalanceDisplay(user.balance);
      document.getElementById('profile-phone').textContent = user.phone;
      document.getElementById('auth-modal').classList.add('hidden');
      document.getElementById('app-content').classList.remove('hidden');
      loadHistory();
    }

    function updateBalanceDisplay(bal) {
      currentUser.balance = bal;
      document.getElementById('balance').textContent = bal.toLocaleString();
      document.getElementById('profile-balance').textContent = bal.toLocaleString();
    }

    function openDepositModal() {
      document.getElementById('dep-step-1').classList.remove('hidden');
      document.getElementById('dep-step-2').classList.add('hidden');
      document.getElementById('deposit-modal').classList.remove('hidden');
    }

    function submitDepositRequest() {
      const method = document.getElementById('dep-method').value;
      const amount = parseFloat(document.getElementById('dep-amount').value);
      if (!amount || amount <= 0) return showToast("ပမာဏ မှားယွင်းနေသည်");

      fetch('/api/transaction/deposit-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentUser.phone, method, amount })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          currentTxId = data.txId;
          showToast("Admin ဖုန်းနံပါတ် ပို့ပေးသည်အထိ ခဏစောင့်ပါ...");
          pollAdminDepositNumber();
        }
      });
    }

    function pollAdminDepositNumber() {
      const interval = setInterval(() => {
        fetch(`/api/transaction/check-status/${currentTxId}`)
          .then(r => r.json())
          .then(data => {
            if (data.success && data.transaction.status === 'WAITING_USER_PAY') {
              clearInterval(interval);
              document.getElementById('admin-pay-number').textContent = data.transaction.admin_pay_number;
              document.getElementById('dep-step-1').classList.add('hidden');
              document.getElementById('dep-step-2').classList.remove('hidden');
            }
          });
      }, 2000);
    }

    function confirmDepositPayment() {
      const userPayPhone = document.getElementById('dep-user-phone').value;
      const txnId = document.getElementById('dep-txn-id').value;

      fetch('/api/transaction/deposit-confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ txId: currentTxId, userPayPhone, txnId })
      })
      .then(r => r.json())
      .then(data => {
        showToast(data.message);
        closeModal('deposit-modal');
      });
    }

    function openWithdrawModal() { document.getElementById('withdraw-modal').classList.remove('hidden'); }

    function submitWithdraw() {
      const method = document.getElementById('wd-method').value;
      const userPayPhone = document.getElementById('wd-user-phone').value;
      const amount = parseFloat(document.getElementById('wd-amount').value);

      fetch('/api/transaction/withdraw-request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentUser.phone, method, amount, userPayPhone })
      })
      .then(r => r.json())
      .then(data => {
        showToast(data.message);
        if (data.success) closeModal('withdraw-modal');
      });
    }

    function openBetModal(sel) {
      selectedSelection = sel;
      document.getElementById('bet-title').textContent = `လောင်းမည်: [ ${sel} ]`;
      document.getElementById('bet-modal').classList.remove('hidden');
    }

    function submitBet() {
      const amt = parseFloat(document.getElementById('bet-amount').value);
      fetch('/api/bet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone: currentUser.phone, selection: selectedSelection, amount: amt })
      })
      .then(r => r.json())
      .then(data => {
        if (data.success) {
          updateBalanceDisplay(data.newBalance);
          showToast("လောင်းကြေး တင်ပြီးပါပြီ");
          closeModal('bet-modal');
        } else showToast(data.message);
      });
    }

    function loadHistory() {
      fetch('/api/history').then(r => r.json()).then(rows => {
        const tbody = document.getElementById('history-rows');
        tbody.innerHTML = '';
        rows.forEach(r => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${r.period}</td><td><b>${r.number}</b></td><td>${r.bigSmall}</td><td>${r.color}</td>`;
          tbody.appendChild(tr);
        });
      });
    }

    function switchTab(tab) {
      document.getElementById('page-game').classList.toggle('hidden', tab !== 'game');
      document.getElementById('page-profile').classList.toggle('hidden', tab !== 'profile');
    }

    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
    function logout() { localStorage.removeItem('user_phone'); location.reload(); }

    socket.on('timer_tick', (data) => {
      document.getElementById('period-text').textContent = data.period;
      document.getElementById('timer-display').textContent = `00:${data.timeLeft < 10 ? '0' + data.timeLeft : data.timeLeft}`;
    });

    socket.on('new_game_result', () => {
      loadHistory();
      if (currentUser) fetch(`/api/user/${currentUser.phone}`).then(r => r.json()).then(d => updateBalanceDisplay(d.user.balance));
    });

    checkAutoLogin();
  </script>
</body>
</html>
