<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚙️ Admin Full Live Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    body { font-family: sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 15px; }
    .card { background: #161e2e; padding: 15px; margin-bottom: 15px; border-radius: 10px; border: 1px solid #334155; }
    h3 { margin-top: 0; color: #f59e0b; }
    input, button, select { padding: 10px; margin: 5px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; width: 100%; box-sizing: border-box; }
    button { cursor: pointer; background: #f59e0b; color: #000; font-weight: bold; border: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #334155; padding: 8px; text-align: center; }
    th { background: #1e293b; color: #38bdf8; }
    .timer-badge { font-size: 20px; font-weight: bold; color: #38bdf8; float: right; }
  </style>
</head>
<body>

  <h2>⚙️ Admin Control Panel <span class="timer-badge" id="adminTimer">00:00</span></h2>
  <a href="/" style="color: #38bdf8; font-weight: bold;">← Back to Main Game</a>

  <!-- 1. Outcome Control -->
  <div class="card" style="border-color: #ef4444; margin-top: 15px;">
    <h3 style="color: #ef4444;">🎲 Set Next Round Result</h3>
    <p style="font-size: 12px; color: #94a3b8;">နောက်တစ်ကြိမ် ထွက်မယ့် ဂဏန်းကို ရွေးပါ (Auto ထားရင် Random ထွက်ပါမယ်)</p>
    <select id="targetOutcome">
      <option value="">🎰 Auto Random</option>
      <option value="0">Number 0 (Purple/Red)</option>
      <option value="1">Number 1 (Green)</option>
      <option value="2">Number 2 (Red)</option>
      <option value="3">Number 3 (Green)</option>
      <option value="4">Number 4 (Red)</option>
      <option value="5">Number 5 (Purple/Green)</option>
      <option value="6">Number 6 (Red)</option>
      <option value="7">Number 7 (Green)</option>
      <option value="8">Number 8 (Red)</option>
      <option value="9">Number 9 (Green)</option>
    </select>
    <button onclick="setOutcome()" style="background: #ef4444; color: #fff;">Save Outcome</button>
  </div>

  <!-- 2. Live Current Round Bets Tracker -->
  <div class="card">
    <h3>📊 Live Bets (ခုပွဲမှာ User တွေ လောင်းထားသည်များ)</h3>
    <table>
      <thead>
        <tr>
          <th>User</th>
          <th>Type</th>
          <th>Value</th>
          <th>Amount</th>
        </tr>
      </thead>
      <tbody id="liveBetsTable">
        <tr><td colspan="4">No bets placed yet in this round</td></tr>
      </tbody>
    </table>
  </div>

  <!-- 3. Balance Control -->
  <div class="card">
    <h3>💰 User Balance Deposit / Withdraw</h3>
    <input type="text" id="targetUser" placeholder="Username (e.g. user1)">
    <input type="number" id="transferAmt" placeholder="Amount (e.g. 5000 or -2000)">
    <button onclick="updateBalance()">Update Balance</button>
  </div>

<script>
  const socket = io();

  socket.on('timer_update', (data) => {
    let secs = data.timer < 10 ? '0' + data.timer : data.timer;
    document.getElementById('adminTimer').innerText = `P:${data.period} | 00:${secs}`;
  });

  // Track live bets
  let currentBetsList = [];
  socket.on('admin_bet_update', (bet) => {
    currentBetsList.push(bet);
    renderLiveBets();
  });

  socket.on('round_ended', () => {
    currentBetsList = []; // clear on new round
    renderLiveBets();
  });

  function renderLiveBets() {
    const tbody = document.getElementById('liveBetsTable');
    if (currentBetsList.length === 0) {
      tbody.innerHTML = '<tr><td colspan="4">No bets placed yet in this round</td></tr>';
      return;
    }
    tbody.innerHTML = currentBetsList.map(b => `
      <tr>
        <td><b>${b.username}</b></td>
        <td>${b.type}</td>
        <td><span style="color:#f59e0b">${b.value}</span></td>
        <td>K${b.amount}</td>
      </tr>
    `).join('');
  }

  async function setOutcome() {
    const number = document.getElementById('targetOutcome').value;
    const res = await fetch('/api/admin/set-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number })
    });
    if(res.ok) alert('အထွက်ဂဏန်း သတ်မှတ်ပြီးပါပြီ!');
  }

  async function updateBalance() {
    const username = document.getElementById('targetUser').value;
    const amount = document.getElementById('transferAmt').value;

    const res = await fetch('/api/admin/update-balance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, amount })
    });
    const data = await res.json();
    if(res.ok) {
      alert(`User: ${username} ၏ လက်ကျန်ငွေ ပြင်ဆင်ပြီးပါပြီ။ Current: K${data.balance}`);
    } else {
      alert(data.error);
    }
  }
</script>
</body>
</html>
