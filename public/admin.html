<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <title>CK Lottery Control Center</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
    .card { background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #334155; }
    h2, h3 { color: #f59e0b; margin-bottom: 12px; }
    input, select { padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; margin-right: 8px; }
    button { padding: 10px 16px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #3b82f6; color: white; }
    .btn-danger { background: #ef4444; }
    .btn-success { background: #10b981; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; text-align: left; }
    th, td { padding: 10px; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>
  <h2>👑 Admin Control Center</h2>

  <!-- Force Result -->
  <div class="card">
    <h3>🎯 ထွက်ဂဏန်း ထိန်းချုပ်ရန် (Forced Winning Number)</h3>
    <input type="number" id="force-num" min="0" max="9" placeholder="ဂဏန်း (0-9)">
    <button class="btn-success" onclick="setForceResult()">သတ်မှတ်မည်</button>
  </div>

  <!-- User Management -->
  <div class="card">
    <h3>👥 User မ်ားအား ထိန်းချုပ်ရန်</h3>
    <table>
      <thead>
        <tr>
          <th>ဖုန်းနံပါတ်</th>
          <th>Balance (K)</th>
          <th>အခြေအနေ</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="user-rows"></tbody>
    </table>
  </div>

  <script>
    function loadUsers() {
      fetch('/api/admin/users').then(r => r.json()).then(users => {
        const tbody = document.getElementById('user-rows');
        tbody.innerHTML = '';
        users.forEach(u => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td><b>${u.phone}</b></td>
            <td><input type="number" value="${u.balance}" id="bal-${u.phone}" style="width: 100px;"> <button onclick="updateBalance('${u.phone}')">ပြင်မည်</button></td>
            <td><span style="color:${u.status === 'BANNED' ? '#ef4444' : '#10b981'}">${u.status}</span></td>
            <td><button class="${u.status === 'BANNED' ? 'btn-success' : 'btn-danger'}" onclick="toggleBan('${u.phone}', '${u.status}')">${u.status === 'BANNED' ? 'Unban' : 'Ban'}</button></td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    function updateBalance(phone) {
      const bal = parseFloat(document.getElementById(`bal-${phone}`).value);
      fetch('/api/admin/update-balance', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, balance: bal })
      }).then(() => { alert("Balance ပြင်ဆင်ပြီးပါပြီ"); loadUsers(); });
    }

    function toggleBan(phone, currentStatus) {
      const nextStatus = currentStatus === 'BANNED' ? 'ACTIVE' : 'BANNED';
      fetch('/api/admin/toggle-ban', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phone, status: nextStatus })
      }).then(() => loadUsers());
    }

    function setForceResult() {
      const num = document.getElementById('force-num').value;
      if (num === '') return alert("ဂဏန်း ရိုက်ထည့်ပါ");
      fetch('/api/admin/set-result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ number: num })
      }).then(r => r.json()).then(d => alert(d.message));
    }

    loadUsers();
  </script>
</body>
</html>
